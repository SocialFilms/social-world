# Netlify settings for socialfilms.world
# The website's files live in the social-films-website folder, so publish that folder.
# This is a plain static site: no build step.
[build]
  publish = "social-films-website"

# Old domain: send everything on socialfilms.ca (with or without www) to the new site.
# Old Squarespace page addresses don't exist here, so they all land on the home page.
# These only take effect once socialfilms.ca is added to this Netlify project as a
# domain alias and its DNS points to Netlify.
[[redirects]]
  from = "https://socialfilms.ca/*"
  to = "https://socialfilms.world/"
  status = 301
  force = true

[[redirects]]
  from = "http://socialfilms.ca/*"
  to = "https://socialfilms.world/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.socialfilms.ca/*"
  to = "https://socialfilms.world/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.socialfilms.ca/*"
  to = "https://socialfilms.world/"
  status = 301
  force = true

# The separate Non-profits page was removed: send old links to the
# Community Orgs section on the home page.
[[redirects]]
  from = "/nonprofits"
  to = "/#nonprofits"
  status = 301

[[redirects]]
  from = "/nonprofits.html"
  to = "/#nonprofits"
  status = 301

# The separate Brands page was removed: send old links to the
# Sponsors section on the home page.
[[redirects]]
  from = "/brands"
  to = "/#brands"
  status = 301

[[redirects]]
  from = "/brands.html"
  to = "/#brands"
  status = 301

# The About page was removed: send old links to the home page.
[[redirects]]
  from = "/about"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/"
  status = 301
